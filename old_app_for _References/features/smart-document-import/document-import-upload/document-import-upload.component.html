<div class="upload-box">
  <label class="btn btn-sm btn-outline-primary mb-0" [class.disabled]="uploading">
    <i class="bi bi-upload me-1"></i>{{ uploading ? 'Uploading...' : 'Choose PDF/Image' }}
    <input
      type="file"
      accept="application/pdf,image/png,image/jpeg,image/jpg,image/webp"
      (change)="onFileInputChange($event)"
      [disabled]="uploading"
      hidden
    />
  </label>

  <div class="selected-file" *ngIf="selectedFileName">
    <i class="bi bi-file-earmark me-1"></i>{{ selectedFileName }}
  </div>
</div>
