<div class="pdf-panel">
  <div class="pdf-panel-header">
    <div class="pdf-title-group">
      <strong>PDF Preview</strong>
      <span>Full source document</span>
    </div>

    <div class="pdf-actions">
      <a *ngIf="stableOpenUrl" class="btn btn-sm btn-outline-secondary" [href]="stableOpenUrl" target="_blank" rel="noopener">
        <i class="bi bi-box-arrow-up-right me-1"></i>Open PDF
      </a>
      <a *ngIf="stableOpenUrl" class="btn btn-sm btn-outline-secondary" [href]="stableOpenUrl" target="_blank" rel="noopener" download>
        <i class="bi bi-download me-1"></i>Download
      </a>
    </div>
  </div>

  <div class="pdf-viewer-shell">
    <iframe
      *ngIf="hasPdfPreview"
      class="pdf-frame"
      [src]="safePdfUrl"
      title="Imported PDF preview"
      [class.is-active]="hasPdfPreview"
    ></iframe>

    <img *ngIf="!hasPdfPreview && hasImagePreview" class="image-frame" [src]="safeImageUrl || ''" alt="Imported image preview" />

    <div class="fallback text-muted" [class.is-hidden]="hasPdfPreview || hasImagePreview">
      <div class="fallback-icon"><i class="bi bi-file-earmark-pdf"></i></div>
      <div class="fallback-title">Source preview not available</div>
      <div class="fallback-file" *ngIf="fileName; else noFile">{{ fileName }}</div>
      <ng-template #noFile>
        <div class="fallback-file">No PDF uploaded yet.</div>
      </ng-template>
      <div class="fallback-actions">
        <a *ngIf="stableOpenUrl" class="btn btn-sm btn-outline-secondary" [href]="stableOpenUrl" target="_blank" rel="noopener">Open PDF</a>
        <a *ngIf="stableOpenUrl" class="btn btn-sm btn-outline-secondary" [href]="stableOpenUrl" target="_blank" rel="noopener" download>Download</a>
      </div>
    </div>

    <div class="preview-overlay" *ngIf="isBusy">
      <div class="overlay-chip">
        <span class="spinner-border spinner-border-sm" role="status" aria-hidden="true"></span>
        <span>{{ busyLabel }}</span>
      </div>
    </div>
  </div>
</div>
