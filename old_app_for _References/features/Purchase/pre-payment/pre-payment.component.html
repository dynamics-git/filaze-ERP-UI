<ng-container>
  <div class="story-section">
    <div class="story-header">
      <span *ngIf="originalAmountToPrepayment">
        Original Amount:
        <strong>{{ originalAmountToPrepayment | number:'1.2-2' }}</strong>
      </span>
    </div>

    <div class="story-card">
      <form [formGroup]="headerFormGroup">
        <ng-container *ngFor="let section of headerConfig.sections">
          <ng-container *ngFor="let row of section.controls; let rowIndex = index">
            <div class="info-block">
              <ng-container *ngFor="let control of row">
                <div class="story-field">
                  <form-field
                    [control]="control"
                    [formGroup]="headerFormGroup"
                    [tableView]="false"
                    (changeEvent)="onChange($event)"
                    (leaveEvent)="onLeave($event)">
                  </form-field>
                </div>
              </ng-container>
            </div>
          </ng-container>
        </ng-container>
      </form>
    </div>

    <div class="story-card mb-3">
      <div class="table-responsive">
        <table class="table table-bordered table-sm mb-0">
          <thead>
            <tr>
              <th>Type</th>
              <th>No</th>
              <th class="text-end">Amount</th>
            </tr>
          </thead>
          <tbody>
            <tr *ngFor="let row of previewLines" [class.is-prepayment]="row.rowType === 'prepayment'">
              <td>{{ row.Type }}</td>
              <td>{{ row.No }}</td>
              <td class="text-end">{{ row.Amount | number:'1.2-2' }}</td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>
</ng-container>
