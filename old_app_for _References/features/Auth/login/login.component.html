<div class="login-shell">
  <div class="login-shell__backdrop"></div>

  <div class="login-wrapper">
    <div class="login-panel">
      <div class="login-panel__header">
        <div class="login-logo login-logo--solo">
          <img src="../../../../assets/images/procure360_logo.svg" alt="Procure360" />
        </div>

        <div *ngIf="mssg" class="login-message">
          {{ mssg }}
        </div>
      </div>

      <div class="login-section-head">
        <h1 class="login-title">Sign in</h1>
        <p class="login-subtitle">Use your company account to access the workspace.</p>
      </div>

      <div class="login-status-row">
        <span class="login-status-text" [class.is-active]="companyLoading">
          {{ companyLoading ? 'Loading companies...' : '' }}
        </span>

        <span class="login-status-text" [class.is-active]="!companyLoading && lastLoginLoading">
          {{ !companyLoading && lastLoginLoading ? 'Checking account details...' : '' }}
        </span>

        <span
          class="login-status-text"
          [class.is-active]="!companyLoading && !lastLoginLoading && !!sessionService.UserLastLoginInfo"
        >
          <ng-container *ngIf="!companyLoading && !lastLoginLoading && sessionService.UserLastLoginInfo">
            Last login: <strong>{{ sessionService.UserLastLoginInfo }}</strong>
          </ng-container>
        </span>
      </div>

      <form [formGroup]="loginForm" (ngSubmit)="login()" class="login-form" novalidate>
        <div class="form-group">
          <label for="company">Company</label>
          <ng-select
            id="company"
            formControlName="company"
            class="login-company-select"
            [items]="companies"
            bindLabel="name"
            bindValue="id"
            [placeholder]="Comapny?.value ? '' : (companyLoading ? 'Loading companies...' : 'Select company')"
            [clearable]="false"
            [searchable]="false"
            [loading]="companyLoading"
            [ngClass]="{ 'is-invalid': submitted && Comapny?.invalid }">
          </ng-select>
        </div>

        <div class="login-form__grid">
          <div class="form-group">
            <label for="email">Email</label>
            <input
              id="email"
              type="email"
              formControlName="username"
              class="form-control"
              placeholder="Enter your email"
              [readonly]="companyLoading || loginLoading"
              [ngClass]="{ 'is-invalid': submitted && UserName?.invalid }"
              (blur)="handleUsernameBlur()"
              autofocus
            />
          </div>

          <div class="form-group">
            <label for="password">Password</label>
            <input
              id="password"
              type="password"
              formControlName="password"
              class="form-control"
              placeholder="Enter your password"
              autocomplete="current-password"
              [readonly]="companyLoading || loginLoading"
              [ngClass]="{ 'is-invalid': submitted && Password?.invalid }"
            />
          </div>
        </div>

        <button
          type="submit"
          class="btn login-submit"
          [disabled]="bttndsbl || companyLoading || loginLoading"
        >
          <span *ngIf="!loginLoading">Sign in</span>
          <span *ngIf="loginLoading">Signing in...</span>
        </button>
      </form>

      <div class="login-footer">
        <span>Developed by Tecsa Software Malaysia</span>
        <span class="login-footer__dot"></span>
        <span>2025</span>
      </div>
    </div>
  </div>
</div>
