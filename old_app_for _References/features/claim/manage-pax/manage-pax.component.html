

 <app-dynamic-loader [loading]="loading"></app-dynamic-loader>
<div class="modal-header border-0 pb-2">
  <div>
    <h5 class="modal-title mb-1 fw-semibold">Manage PAX</h5>
    <div class="text-muted small">Per-person compliance check</div>
  </div>
</div>
<div class="modal-body pt-2">
  <!-- ================= SUMMARY ROW ================= -->
  <div class="row align-items-end mb-4">
    <!-- Amount -->
    <div class="col-4">
      <div class="text-muted small mb-1">Amount</div>
      <div class="fw-semibold fs-6">
        {{ amount | number:'1.2-2' }}
      </div>
    </div>
    <!-- No of PAX (ONLY editable field) -->
    <div class="col-4">
      <label class="text-muted small mb-1">No of PAX</label>
      <input type="number" class="form-control" [(ngModel)]="noOfPAX" (input)="calculate()" min="0" />
    </div>
    <!-- Per Person -->
    <div class="col-4">
      <div class="text-muted small mb-1">Per Person</div>
      <div class="fw-semibold fs-6" [ngClass]="{'text-danger': exceedsLimit}">
        {{ paxValue | number:'1.2-2' }}
      </div>
    </div>
  </div>
  <!-- ================= STATUS ================= -->
  <div *ngIf="exceedsLimit || geAttachments.length > 0 || pendingGEFiles.length > 0" class="mb-4 p-3 rounded bg-light">
    <!-- Required -->
    <div *ngIf="exceedsLimit && geAttachments.length === 0 && pendingGEFiles.length === 0"
      class="text-warning fw-medium d-flex align-items-center">
      <i class="bi bi-exclamation-triangle me-2"></i>
      GE Form required (limit exceeded)
    </div>
    <!-- Attached -->
    <div *ngIf="exceedsLimit && (geAttachments.length > 0 || pendingGEFiles.length > 0)"
      class="text-success fw-medium d-flex align-items-center">
      <i class="bi bi-check-circle me-2"></i>
      GE Form attached successfully
    </div>
    <!-- Within limit -->
    <div *ngIf="!exceedsLimit" class="text-success fw-medium d-flex align-items-center">
      <i class="bi bi-check2-circle me-2"></i>
      Within allowed limit
    </div>
  </div>
  <!-- ================= GE SECTION ================= -->
  <div *ngIf="exceedsLimit || geAttachments.length > 0 || pendingGEFiles.length > 0" class="mb-3">
    <!-- Header -->
    <div class="d-flex justify-content-between align-items-center mb-2">
      <div class="fw-medium">GE Form Attachment</div>
      <button type="button" class="btn btn-sm btn-outline-primary" (click)="uploadGEForm()">
        <i class="bi bi-paperclip me-1"></i>
        Upload
      </button>
    </div>
    <!-- Pending Files -->
    <div *ngIf="pendingGEFiles.length > 0" class="mb-2">
      <div *ngFor="let file of pendingGEFiles; let i = index"
        class="d-flex justify-content-between align-items-center border rounded px-3 py-2 mb-2">
        <div class="small">
          <i class="bi bi-file-earmark me-2 text-muted"></i>
          {{ file.name }}
        </div>
        <button type="button" class="btn btn-sm btn-outline-danger" (click)="removePendingFile(i)">
          Remove
        </button>
      </div>
    </div>
    <!-- Existing Files -->
    <div *ngIf="geAttachments.length > 0">
      <div *ngFor="let doc of geAttachments; let i = index"
        class="d-flex justify-content-between align-items-center border rounded px-3 py-2 mb-2">
        <div class="small">
          <i class="bi bi-file-earmark me-2 text-muted"></i>
          {{ doc.FileName }}
        </div>
        <button class="btn btn-sm btn-outline-danger" (click)="deleteGEAttachment(doc, i)">
          Remove
        </button>
      </div>
    </div>
  </div>
  <!-- Error -->
  <div *ngIf="errorMessage" class="text-danger small mt-2">
    {{ errorMessage }}
  </div>
</div>
<div class="modal-footer border-0 pt-2">
  <button type="button" class="btn btn-success px-4" (click)="confirm()">
    Close
  </button>
</div>
