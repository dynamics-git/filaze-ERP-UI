<div class="report-filters">

  <div class="filter-item"
       *ngFor="let filter of activeFilters; let i = index">

    <ng-container *ngIf="!filter.field && i === activeFilters.length - 1">
      <select class="form-select form-select-sm field-select"
              [(ngModel)]="filter.field"
              (change)="updateField(i)">
        <option value="">Select field</option>
        <option *ngFor="let option of getAvailableFilterOptions(i)"
                [value]="option.key">
          {{ option.label }}
        </option>
      </select>
    </ng-container>

    <ng-container *ngIf="filter.field">

      <span class="filter-label">
        {{ getField(filter.field)?.label }}
      </span>

      <input *ngIf="getField(filter.field)?.type === 'date'"
             type="date"
             class="form-control form-control-sm"
             [(ngModel)]="filter.value" />

      <input *ngIf="getField(filter.field)?.type === 'text'
                 || getField(filter.field)?.type === 'number'"
             [type]="getField(filter.field)?.type"
             class="form-control form-control-sm"
             [(ngModel)]="filter.value" />

      <select *ngIf="getField(filter.field)?.type === 'select'"
              class="form-select form-select-sm"
              [(ngModel)]="filter.value">
        <option value="">Select value</option>
        <option *ngFor="let opt of getField(filter.field)?.options"
                [value]="opt.value">
          {{ opt.label }}
        </option>
      </select>

      <button type="button"
              class="remove-btn"
              (click)="removeFilter(i)">
        ✕
      </button>

    </ng-container>

  </div>

  <button type="button"
          class="btn btn-sm btn-success apply-btn"
          (click)="onApply()">
    Apply
  </button>

</div>
