<div class="bc-factbox">

  <div class="bc-factbox-tabs">
    <div class="bc-tab" [class.active]="activeTab === 'details'" (click)="activeTab = 'details'">
      <i class="bi bi-info-circle"></i>
      <span>Details</span>
    </div>

    <div class="bc-tab" [class.active]="activeTab === 'attachments'" (click)="activeTab = 'attachments'">
      <i class="bi bi-paperclip"></i>
      <span>Attachments</span>
    </div>
  </div>

  <div class="bc-factbox-content">

    <ng-container *ngIf="activeTab === 'details'">

      <app-rfq-workflow-factbox
        *ngIf="itemConfig?.informationSectionConfig?.rfqWorkflow?.enabled"
        [headerData]="headerData"
        [itemConfig]="itemConfig"
        [lineData]="lineData"
        (action)="procurementFlowAction.emit($event)">
      </app-rfq-workflow-factbox>

      <app-procurement-flow-panel
        *ngIf="!itemConfig?.informationSectionConfig?.rfqWorkflow?.enabled"
        [headerData]="headerData"
        [itemConfig]="itemConfig"
        [lineData]="lineData"
        [documentNo]="documentNo"
        (action)="procurementFlowAction.emit($event)">
      </app-procurement-flow-panel>

      <div
        class="bc-block bc-block--summary"
        *ngIf="(summaryFields && summaryFields.length > 0) || (summaryLineFields && summaryLineFields.length > 0)">

        <app-summary
          [headerData]="headerData"
          [summaryFields]="summaryFields"
          [summaryLineFields]="summaryLineFields"
          [lineData]="selectedLineForSummary">
        </app-summary>
      </div>

      <div class="bc-block">
        <div class="bc-block-title">Approval History</div>

        <app-approval-log-entries
          [documentNo]="documentNo"
          [headerApprovalStatus]="headerData?.ApprovalStatus ?? headerData?.approvalStatus">
        </app-approval-log-entries>
      </div>

    </ng-container>

    <ng-container *ngIf="activeTab === 'attachments'">

      <!--
        ╔══════════════════════════════════════════════════════════════════╗
        ║  ATTACHMENT BLOCK 1 — HEADER DOCUMENT                          ║
        ╠══════════════════════════════════════════════════════════════════╣
        ║  Fetches attachments for the main document (the header).       ║
        ║                                                                ║
        ║  API filter used:                                              ║
        ║    DocumentType eq '<documentType>'                            ║
        ║    and No eq '<documentNoProp value>'                          ║
        ║    and recordLineNo eq 0                                       ║
        ║                                                                ║
        ║  WHAT TO SET IN informationSectionConfig:                      ║
        ║    documentNoProp  → field name on headerData that holds the   ║
        ║                      document number (e.g. 'PreAssignedNo',    ║
        ║                      'claimNo', 'batchNo')                     ║
        ║    documentType    → BC DocumentType string (e.g. 'Invoice',   ║
        ║                      'Employee Claim', 'Claim Payment')        ║
        ║    allowAttachmentUpload: false → POSTED PAGE. Hides Add and   ║
        ║                      Delete for everyone. Use this for any     ║
        ║                      finalized/posted/audit page.              ║
        ║    (omit allowAttachmentUpload) → normal editable page.        ║
        ║                      Upload/delete based on role + status.     ║
        ╚══════════════════════════════════════════════════════════════════╝
      -->
      <app-attachments
        [documentNo]="itemConfig.informationSectionConfig!.useSelectedLineForHeaderAttachments
          ? (selectedLine?.[itemConfig.lineConfig?.relatedDocumentNoProp ?? '']
              ?? headerData[itemConfig.informationSectionConfig!.documentNoProp!])
          : headerData[itemConfig.informationSectionConfig!.documentNoProp!]"
        [documentType]="itemConfig.informationSectionConfig!.useSelectedLineForHeaderAttachments
          ? (itemConfig.lineConfig?.relatedDocumentType
              ?? itemConfig.informationSectionConfig!.documentType!)
          : itemConfig.informationSectionConfig!.documentType!"
        [readonly]="itemConfig.informationSectionConfig!.allowAttachmentUpload === false"
        [isShowUploadButton]="itemConfig.informationSectionConfig!.allowAttachmentUpload !== false"
        [itemConfig]="itemConfig"
        [documentID]="headerData"
        [recordLineNo]="0">
      </app-attachments>

      <!--
        ╔══════════════════════════════════════════════════════════════════╗
        ║  ATTACHMENT BLOCK 2 — LINE DOCUMENT (appears on line select)   ║
        ╠══════════════════════════════════════════════════════════════════╣
        ║  Only shown when user selects a line in the grid.              ║
        ║  Enabled by setting showLineAttachments: true in lineConfig.   ║
        ║                                                                ║
        ║  TWO PATTERNS — choose based on where attachments live in BC:  ║
        ║                                                                ║
        ║  PATTERN A — attachments on the SAME document as header        ║
        ║  (e.g. Posted Purchase Invoice — line attachments are still    ║
        ║   under DocumentType='Invoice', No='108302')                   ║
        ║  → Do NOT set relatedDocumentNoProp or relatedDocumentType.    ║
        ║  → factbox uses lineFKProp + header documentType automatically.║
        ║  → API: DocumentType eq 'Invoice' and No eq '108302'           ║
        ║         and recordLineNo eq <lineNo>                           ║
        ║                                                                ║
        ║  PATTERN B — attachments on a DIFFERENT document entirely      ║
        ║  (e.g. Claim Payment — line has sourceClaimNo='EMPCL10731'     ║
        ║   but attachments are under DocumentType='Employee Claim')     ║
        ║  → Set relatedDocumentNoProp: 'sourceClaimNo' in lineConfig    ║
        ║  → Set relatedDocumentType: 'Employee Claim' in lineConfig     ║
        ║  → API: DocumentType eq 'Employee Claim'                       ║
        ║         and No eq 'EMPCL10731' and recordLineNo eq 0           ║
        ║                                                                ║
        ║  UPLOAD/DELETE CONTROL:                                        ║
        ║  → Inherits same allowAttachmentUpload from informationSection ║
        ║    false = posted page, nobody uploads/deletes                 ║
        ╚══════════════════════════════════════════════════════════════════╝
      -->
      <ng-container *ngIf="itemConfig?.lineConfig?.showLineAttachments && selectedLine">
        <div class="bc-section-divider"></div>
        <app-attachments
          [documentNo]="itemConfig.lineConfig!.relatedDocumentNoProp
            ? selectedLine[itemConfig.lineConfig!.relatedDocumentNoProp]
            : selectedLine[itemConfig.lineConfig!.lineFKProp!]"
          [documentType]="itemConfig.lineConfig!.relatedDocumentType
            ?? itemConfig.informationSectionConfig!.documentType!"
          [readonly]="itemConfig.informationSectionConfig!.allowAttachmentUpload === false"
          [isShowUploadButton]="itemConfig.informationSectionConfig!.allowAttachmentUpload !== false"
          [itemConfig]="itemConfig"
          [sectionTitle]="'Entries Documents'"
          [downloadAllLines]="true"
          [recordLineNo]="itemConfig.lineConfig!.relatedDocumentNoProp
            ? (itemConfig.lineConfig!.relatedLineNoProp
                ? (selectedLine?.[itemConfig.lineConfig!.relatedLineNoProp] ?? 0)
                : 0)
            : (selectedLine?.lineNo ?? selectedLine?.LineNo ?? selectedLine?.lineno ?? 0)">
        </app-attachments>
      </ng-container>

    </ng-container>

  </div>
</div>
