<div class="email-editor-container" *ngIf="mode === 'emailEditor'">
  <div class="d-flex justify-content-between align-items-center pb-1 mb-2 section-title font-weight-bold">
    <div>Email Subject</div>
     <!-- <select class="variable-dropdown" (change)="insertVariableToSubject($event)">
        <option value="">Insert Variable...</option>
        <option *ngFor="let v of variableList" [value]="v">{{ v }}</option>
      </select> -->
  </div>
  <div class="NgxEditor__Wrapper mb-3 subject-wrapper">
    <div class="subject-container">
      <textarea rows="2" maxlength="250" [(ngModel)]="subject" (ngModelChange)="onSubjectChange($event)"
        [placeholder]="'Email Subject...'" class="emailSubject"></textarea>
    </div>
  </div>



  <div class="d-flex justify-content-between align-items-center pb-1 mb-2 section-title font-weight-bold">
    <div>Email Body</div>
  </div>
  <div class="NgxEditor__Wrapper">
    <div class="editor-toolbar">
      <ngx-editor-menu [editor]="bodyEditor" [toolbar]="toolbar" class="flex-grow-1"></ngx-editor-menu>

      <!-- <select class="variable-dropdown" (change)="insertVariableToBody($event)">
        <option value="">Insert Variable...</option>
        <option *ngFor="let v of variableList" [value]="v">{{ v }}</option>
      </select> -->
    </div>

    <ngx-editor [editor]="bodyEditor" [(ngModel)]="body" (ngModelChange)="onBodyChange($event)"
      [placeholder]="'Email Body...'" class="emailBody"></ngx-editor>
  </div>
</div>


<!-- For advance editor -->
<div class="NgxEditor__Wrapper" *ngIf="mode === 'advanceEditor'">

</div>
