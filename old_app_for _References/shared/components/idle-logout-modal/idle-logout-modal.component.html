<div class="session-modal">
  <div
    class="session-modal__icon"
    [class.warning]="mode === 'warning'"
    [class.expired]="mode === 'expired'">
    <i
      class="bi"
      [class.bi-shield-exclamation]="mode === 'warning'"
      [class.bi-clock-history]="mode === 'expired'">
    </i>
  </div>

  <div class="session-modal__body" *ngIf="mode === 'warning'; else expiredBlock">
    <h2 class="session-modal__title">Session expiring soon</h2>
    <p class="session-modal__text">
      You’ve been inactive for a while. To protect your account, your session will end soon unless you continue.
    </p>

    <div class="session-modal__countdown-card">
      <div class="session-modal__countdown-label">Automatic sign-out in</div>
      <div class="session-modal__countdown-time">{{ mm }}:{{ ss }}</div>
    </div>

    <div class="session-modal__actions">
      <button type="button" class="btn btn-light session-btn session-btn--secondary" (click)="signOutNow()">
        Sign out
      </button>
      <button type="button" class="btn btn-primary session-btn session-btn--primary" (click)="continueSession()">
        Continue
      </button>
    </div>
  </div>

  <ng-template #expiredBlock>
    <div class="session-modal__body">
      <h2 class="session-modal__title">Session expired</h2>
      <p class="session-modal__text">
        Your session ended due to inactivity. Please sign in again to continue.
      </p>

      <div class="session-modal__actions">
        <button type="button" class="btn btn-primary session-btn session-btn--primary session-btn--full" (click)="signInAgain()">
          Sign in again
        </button>
      </div>
    </div>
  </ng-template>
</div>
