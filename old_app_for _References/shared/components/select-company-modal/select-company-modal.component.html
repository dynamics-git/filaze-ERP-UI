<div class="company-sheet">
  <div class="company-sheet__header">
    <div class="company-sheet__title-wrap">
      <h3 class="company-sheet__title">Select Company</h3>
      <p class="company-sheet__subtitle">
        Choose the working company for this session.
      </p>
    </div>

    <button
      type="button"
      class="company-sheet__close"
      aria-label="Close"
      (click)="activeModal.dismiss()"
    >
      <i class="bi bi-x-lg"></i>
    </button>
  </div>

  <div class="company-sheet__search">
    <i class="bi bi-search company-sheet__search-icon"></i>

    <input
      #companySearch
      type="text"
      class="company-sheet__search-input"
      placeholder="Search company"
      [value]="searchTerm"
      (input)="onSearch(companySearch.value)"
    />
  </div>

  <div class="company-sheet__body">
    <button
      *ngFor="let company of filteredCompanies; trackBy: trackByCompanyId"
      type="button"
      class="company-option"
      [class.is-selected]="company.id === cpm?.value"
      (click)="selectCompany(company.id)"
    >
      <span class="company-option__icon">
        <i class="bi bi-building"></i>
      </span>

      <span class="company-option__content">
        <span class="company-option__name">{{ company.name }}</span>
        <span class="company-option__meta" *ngIf="company.id === currentCompanyId">
          Current company
        </span>
      </span>

      <span class="company-option__check" *ngIf="company.id === cpm?.value">
        <i class="bi bi-check2"></i>
      </span>
    </button>

    <div class="company-sheet__empty" *ngIf="!filteredCompanies.length">
      No company matched your search.
    </div>
  </div>

  <div class="company-sheet__footer">
    <button
      type="button"
      class="company-sheet__btn company-sheet__btn--secondary"
      (click)="activeModal.dismiss()"
    >
      Cancel
    </button>

    <button
      type="button"
      class="company-sheet__btn company-sheet__btn--primary"
      [disabled]="optionsForm.invalid || isSubmitting"
      (click)="changeCompany(cpm?.value)"
    >
      Continue
    </button>
  </div>
</div>
