<div class="pr-commandbar">
  <div class="pr-commandbar-top">
    <div class="pr-toolbar-strip">
      <button type="button" class="pr-context-pill" [attr.title]="config.title || 'Page'">
        <i class="bi bi-folder2-open"></i>
        <span>{{ config.title || 'Page' }}</span>
        <i class="bi bi-chevron-down pr-context-caret"></i>
      </button>

      <span class="pr-strip-divider"></span>

      <button class="btn pr-cmd-btn pr-cmd-btn-primary" [disabled]="!config.showCreate" (click)="addItem()">
        <i class="bi bi-plus-lg"></i>
        <span>New</span>
      </button>

      <button class="btn pr-cmd-btn" [disabled]="!config.showDelete" (click)="deleteItem()">
        <i class="bi bi-trash"></i>
        <span>Delete</span>
      </button>

      <button
        *ngIf="config.showCopy !== false"
        class="btn pr-cmd-btn"
        [disabled]="!config.showCopy"
        (click)="copyItem()">
        <i class="bi bi-copy"></i>
        <span>Copy</span>
      </button>

      <button class="btn pr-cmd-btn" [disabled]="config.showRefresh === false" (click)="refreshPage()">
        <i class="bi bi-arrow-clockwise"></i>
        <span>Refresh</span>
      </button>

      <ng-container *ngFor="let button of customButtons">
        <button
          class="btn pr-cmd-btn"
          [disabled]="button?.isEnable === false"
          (click)="customButtonClick(button)">
          <i *ngIf="button?.icon" [class]="button.icon"></i>
          <span>{{ button?.label || button?.name }}</span>
        </button>
      </ng-container>

      <ng-container *ngFor="let button of topButtons">
        <button
          class="btn pr-cmd-btn"
          [disabled]="button?.isEnable === false"
          (click)="topcustomButtonClick(button)">
          <i *ngIf="button?.icon" [class]="button.icon"></i>
          <span>{{ button?.label || button?.name }}</span>
        </button>
      </ng-container>

      <div class="pr-menu-anchor" *ngIf="hasActionMenu">
        <button
          type="button"
          class="btn pr-cmd-btn pr-cmd-btn-menu"
          [class.active]="showMoreDropdown"
          (click)="toggleMoreDropdown($event)">
          <span>Actions</span>
          <i class="bi bi-chevron-down"></i>
        </button>

        <div class="pr-dropdown-panel" *ngIf="showMoreDropdown" (click)="$event.stopPropagation()">
          <button
            type="button"
            class="pr-dropdown-item"
            *ngFor="let btn of resolvedMenuButtons"
            [hidden]="btn?.isVisible === false"
            [disabled]="btn?.isEnable === false"
            (click)="menuClick(btn, $event)">
            <span class="pr-dropdown-item-main">
              <span>{{ btn?.label || btn?.name }}</span>
            </span>

            <span
              class="pr-pin-toggle"
              [class.active]="isPinned(btn)"
              [title]="isPinned(btn) ? 'Unpin shortcut' : 'Pin as shortcut'"
              (click)="togglePin(btn, $event)">
              <i class="bi" [ngClass]="isPinned(btn) ? 'bi-bookmark-check-fill' : 'bi-bookmark-plus'"></i>
            </span>
          </button>
        </div>
      </div>

      <ng-container *ngIf="hasPinnedMenuButtons">
        <button
          class="btn pr-cmd-btn pr-cmd-btn-shortcut"
          *ngFor="let btn of pinnedMenuButtons"
          [disabled]="btn?.isEnable === false"
          (click)="menuClick(btn)">
          <i class="bi bi-bookmark-check-fill"></i>
          <span>{{ btn?.label || btn?.name }}</span>
        </button>
      </ng-container>
    </div>
  </div>

  <div class="pr-commandbar-bottom">
    <div class="pr-search-wrapper">
      <input
        type="search"
        class="pr-search-field form-control search-input"
        id="search"
        [placeholder]="'Search ' + (config.title || '')"
        (blur)="showSearchBox = false"
        (search)="searchItem()"
        (keydown.enter)="searchItem(); $event.preventDefault()"
        [(ngModel)]="searchTerm" />

      <button class="pr-search-button" type="button" (click)="searchItem()">
        Search
      </button>
    </div>

    <div class="pr-utility-actions">
      <div class="btn-group btn-group-sm pr-view-toggle" role="group">
        <button
          type="button"
          class="btn pr-icon-btn"
          [ngClass]="{ active: !isGridView }"
          (click)="setGridView(false)"
          title="List view">
          <i class="bi bi-list"></i>
        </button>

        <button
          type="button"
          class="btn pr-icon-btn"
          [ngClass]="{ active: isGridView }"
          (click)="setGridView(true)"
          title="Grid view">
          <i class="bi bi-grid"></i>
        </button>
      </div>

      <div class="pr-menu-anchor">
        <button
          type="button"
          class="btn pr-icon-btn"
          [ngClass]="{ active: showColumnsDropdown }"
          (click)="toggleColumnsDropdown($event)"
          title="Columns">
          <i class="bi bi-layout-three-columns"></i>
        </button>

        <div
          class="pr-dropdown-panel pr-dropdown-panel-columns"
          *ngIf="showColumnsDropdown"
          (click)="$event.stopPropagation()">
          <label class="pr-column-item" *ngFor="let header of allHeadersForChooser">
            <input
              type="checkbox"
              [checked]="isColumnVisible(header)"
              [disabled]="header.isPrimaryLink"
              (change)="onToggleColumn(header, $event)" />
            <span>{{ header.name }}</span>
          </label>
        </div>
      </div>

      <button
        type="button"
        class="btn pr-tool-btn"
        [disabled]="!config.showexportExcel"
        (click)="exportCsv()">
        <i class="bi bi-file-earmark-excel"></i>
        <span>Excel</span>
      </button>

      <div class="pr-menu-anchor">
        <button
          type="button"
          class="btn pr-icon-btn"
          [ngClass]="{ active: showExportDropdown }"
          (click)="toggleExportDropdown($event)"
          title="More export options">
          <i class="bi bi-chevron-down"></i>
        </button>

        <div
          class="pr-dropdown-panel pr-dropdown-panel-export"
          *ngIf="showExportDropdown"
          (click)="$event.stopPropagation()">
          <button
            type="button"
            class="pr-dropdown-item"
            [disabled]="!config.showExportPdf"
            (click)="exportPdf()">
            <i class="bi bi-filetype-pdf"></i>
            <span>PDF</span>
          </button>
        </div>
      </div>

      <button
        type="button"
        class="btn pr-tool-btn"
        [ngClass]="{ active: showCustomFilter || isFilter }"
        (click)="filter()">
        <i [class]="isFilter ? 'bi bi-funnel-fill' : 'bi bi-funnel'"></i>
        <span>Filters</span>
      </button>

      <button
        type="button"
        class="btn pr-tool-btn pr-insights-btn"
        [disabled]="!config.showInformation"
        [ngClass]="{ active: showInformationTabs }"
        (click)="toogleInfoEvent()"
        title="Insights panel">
        <i class="bi" [ngClass]="showInformationTabs ? 'bi-info-circle-fill' : 'bi-info-circle'"></i>
        <span>Insights</span>
      </button>
    </div>
  </div>
</div>
