<div class="erp-notification-banner">
    <div class="message" [attr.title]="errorMessage">
        {{errorMessage}}
    </div>

    <div class="actions">
        <button *ngIf="retryCallback" type="button" class="btn btn-success" (click)="reload()">Retry</button>
        <button type="button" class="btn btn-secondary" (click)="close()">Dismiss</button>
    </div>
</div>
