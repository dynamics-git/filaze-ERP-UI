<div class="app-footer">
  <div class="app-footer__inner">
    <div class="app-footer-left">
      <div class="app-footer__brand-block">
        <span class="app-footer__eyebrow">Workspace</span>
        <span class="app-footer__title">{{ workspaceLabel }}</span>
      </div>

      <span class="app-footer__divider" aria-hidden="true"></span>

      <div class="app-footer__summary">
        {{ workspaceSubtitle }}
      </div>
    </div>

    <div class="app-footer-right">
      <span class="app-footer__status-chip" [class.app-footer__status-chip--live]="environmentLabel === 'Live'">
        {{ environmentLabel }}
      </span>
      <span class="app-footer__build-label">{{ buildLabel }}</span>
      <span class="app-footer__year">© {{ currentYear }}</span>
    </div>
  </div>
</div>
