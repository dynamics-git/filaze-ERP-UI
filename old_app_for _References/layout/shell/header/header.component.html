<header class="app-header">
  <div class="app-header__left">
    <button
      type="button"
      class="app-brand"
      (click)="dashboard()"
      title="Go to dashboard">

      <span class="app-brand__mark" aria-hidden="true">
        <span class="app-brand__mark-letter">F</span>
      </span>

      <span class="app-brand__copy">
        <span class="app-brand__eyebrow">FILAZ ENTERPRISE</span>
        <span class="app-brand__name">Filaz</span>
      </span>
    </button>

    <nav class="app-module-tabs" *ngIf="menuModules.length" aria-label="Primary modules">
      <button
        type="button"
        *ngFor="let module of menuModules; trackBy: trackByModuleKey"
        class="app-module-tab"
        [class.is-active]="module.key === activeModuleKey"
        [title]="module.title"
        (click)="selectModule(module)">
        <span>{{ module.title }}</span>
      </button>
    </nav>
  </div>

  <div class="app-header__right">
    <div class="app-header__tools">
      <div class="app-notification">
        <button
          type="button"
          class="app-icon-button"
          title="Notification Center"
          (click)="openSystemActivity()">
          <i class="bi bi-bell"></i>
        </button>

        <span class="app-notification__badge" *ngIf="notificationCount > 0">
          {{ notificationBadgeLabel }}
        </span>
      </div>
    </div>

    <div class="app-context-bar">
      <div class="app-context-pill app-context-pill--environment">
        <span class="app-context-pill__label">Environment</span>
        <span class="app-context-pill__value">
          {{ isLive ? 'Live' : 'Sandbox' }}
        </span>
      </div>

      <button
        type="button"
        class="app-context-pill app-context-pill--button app-context-pill--company"
        (click)="changeCompany()"
        [title]="company || 'Select Company'">
        <span class="app-context-pill__label">Company</span>
        <span class="app-context-pill__value app-context-pill__value--truncate">
          {{ company || 'Select Company' }}
        </span>
        <i class="bi bi-chevron-down app-context-pill__caret"></i>
      </button>

      <ng-container *ngIf="showResponsibilityCenter">
        <button
          *ngIf="canChangeResCenter; else readonlyResCenter"
          type="button"
          class="app-context-pill app-context-pill--button app-context-pill--res-center"
          (click)="changeResCenter()"
          [title]="responsibilityCenterName || 'Responsibility Center'">
          <span class="app-context-pill__label">Res. Centre</span>
          <span class="app-context-pill__value app-context-pill__value--truncate">
            {{ responsibilityCenterName || 'All Centres' }}
          </span>
          <i class="bi bi-chevron-down app-context-pill__caret"></i>
        </button>

        <ng-template #readonlyResCenter>
          <div
            class="app-context-pill app-context-pill--res-center"
            [title]="responsibilityCenterName || 'Responsibility Center'">
            <span class="app-context-pill__label">Res. Centre</span>
            <span class="app-context-pill__value app-context-pill__value--truncate">
              {{ responsibilityCenterName || 'All Centres' }}
            </span>
          </div>
        </ng-template>
      </ng-container>
    </div>

    <div class="app-header__divider"></div>

    <app-user-box></app-user-box>
  </div>
</header>
