@if (activePopup$ | async; as popup) {
  <div class="filaz-erp-popup-host">
    <div class="popup-backdrop" (click)="onBackdropClick(popup)"></div>

    <section class="popup-shell" [class.full-page]="isFullPagePopup(popup)">
      @if (isDocumentPopup(popup)) {
        <app-entry-dialog
          [pageLabel]="getEntryDialogConfig(popup)?.pageLabel ?? 'PAGE'"
          [title]="getEntryDialogConfig(popup)?.title ?? 'Account journal'"
          [subtitle]="getEntryDialogConfig(popup)?.subtitle ?? 'General ledger · Cronus International Ltd.'"
          [popupHeaderSections]="getEntryDialogConfig(popup)?.headerSections"
          [popupHeaderData]="getEntryDialogConfig(popup)?.headerData"
          [popupLineColumns]="getEntryDialogConfig(popup)?.lineColumns"
          [popupLineRows]="getEntryDialogConfig(popup)?.lineRows"
          [popupLineTotals]="getEntryDialogConfig(popup)?.lineTotals"
          (closed)="close(popup.id)">
        </app-entry-dialog>
      }
    </section>
  </div>
}
