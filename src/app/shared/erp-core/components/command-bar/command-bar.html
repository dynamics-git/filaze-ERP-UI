<section class="filaz-commandbar">
  <div class="command-work">
    <ng-content select="[erp-command-work]"></ng-content>
  </div>

  <div class="command-main">
    @if (standardActions.new !== false) {
      <button type="button" class="cmd-primary" (click)="runStandardAction('new')">
        <i class="bi bi-plus-lg"></i>
        New
      </button>
    }

    @if (standardActions.delete !== false) {
      <button type="button" class="cmd" (click)="runStandardAction('delete')">Delete</button>
    }

    @if (standardActions.refresh !== false) {
      <button type="button" class="cmd" (click)="runStandardAction('refresh')">Refresh</button>
    }

    @if (hasStandardActions && visibleCommands.length) {
      <span class="cmd-divider"></span>
    }

    @for (item of visibleCommands; track item.actionKey + '-' + item.label) {
      <button
        type="button"
        [class.cmd-primary]="item.tone === 'primary' || item.isPrimary"
        [class.cmd]="item.tone !== 'primary' && !item.isPrimary"
        [class.cmd-danger]="item.tone === 'danger'"
        [disabled]="item.disabled"
        [title]="item.tooltip ?? item.label"
        (click)="runCommand(item)"
      >
        @if (item.icon) {
          <i [class]="item.icon"></i>
        }
        {{ item.label }}
        @if (item.trailingIcon) {
          <i [class]="item.trailingIcon"></i>
        }
      </button>
    }
  </div>

  <div class="command-tools">
    <ng-content select="[erp-command-tools]"></ng-content>
  </div>
</section>
