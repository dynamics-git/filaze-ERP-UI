<section class="filaz-erp-document-container">
  @if (loading) {
    <div class="document-state">Loading document...</div>
  } @else if (error) {
    <div class="document-state error">{{ error }}</div>
  } @else if (config) {
    <erp-document-page
      [config]="config"
      [headerData]="headerData"
      [lineData]="lineData"
      (command)="emitCommand($event)"
    ></erp-document-page>
  } @else {
    <div class="document-state">No document configured</div>
  }
</section>
