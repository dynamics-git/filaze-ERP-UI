<form class="filaz-erp-form">
  @for (field of visibleFields; track field.key) {
    <label class="form-field" [style.width]="field.width ?? null">
      <span>
        {{ field.label }}
        @if (field.required) {
          <strong>*</strong>
        }
      </span>

      @switch (field.type) {
        @case ('number') {
          <input
            type="number"
            [value]="getFieldValue(field)"
            [readonly]="isReadonly(field)"
            [placeholder]="field.placeholder ?? ''"
            (input)="updateFromEvent(field, $event)"
          />
        }
        @case ('date') {
          <input
            type="date"
            [value]="getFieldValue(field)"
            [readonly]="isReadonly(field)"
            [placeholder]="field.placeholder ?? ''"
            (input)="updateFromEvent(field, $event)"
          />
        }
        @case ('boolean') {
          <input
            type="checkbox"
            [checked]="!!getFieldValue(field)"
            [disabled]="isReadonly(field)"
            (change)="updateFromEvent(field, $event)"
          />
        }
        @case ('currency') {
          <input
            type="number"
            [value]="getFieldValue(field)"
            [readonly]="isReadonly(field)"
            [placeholder]="field.placeholder ?? ''"
            (input)="updateFromEvent(field, $event)"
          />
        }
        @case ('select') {
          <select
            [value]="getFieldValue(field)"
            [disabled]="isReadonly(field)"
            (change)="updateFromEvent(field, $event)"
          >
            <option value="">{{ field.placeholder ?? 'Select' }}</option>
            @for (option of field.options ?? []; track option.label) {
              <option [value]="option.value">{{ option.label }}</option>
            }
          </select>
        }
        @case ('lookup') {
          <div class="lookup-field">
            <input
              type="text"
              [value]="getFieldValue(field)"
              [readonly]="isReadonly(field)"
              [placeholder]="field.placeholder ?? 'Lookup'"
              (input)="updateFromEvent(field, $event)"
            />
            <button type="button" [disabled]="isReadonly(field)">Open</button>
          </div>
        }
        @case ('textarea') {
          <textarea
            [value]="getFieldValue(field)"
            [readonly]="isReadonly(field)"
            [placeholder]="field.placeholder ?? ''"
            (input)="updateFromEvent(field, $event)"
          ></textarea>
        }
        @default {
          <input
            type="text"
            [value]="getFieldValue(field)"
            [readonly]="isReadonly(field)"
            [placeholder]="field.placeholder ?? ''"
            (input)="updateFromEvent(field, $event)"
          />
        }
      }
    </label>
  }
</form>
