<section class="profile-shell" aria-label="User profile">
  <header class="profile-head">
    <div class="profile-head-left">
      <div class="profile-avatar">{{ userInitials }}</div>
      <div class="profile-title">
        <h1>{{ fullName }}</h1>
        <p>{{ userEmail }}</p>
      </div>
    </div>

    <div class="profile-head-actions">
      <button type="button" class="btn btn-secondary" (click)="goHome()">Back</button>
      <button type="button" class="btn btn-danger" (click)="logout()">Sign out</button>
    </div>
  </header>

  <article class="profile-card">
    <h2>Identity</h2>
    <div class="profile-row">
      <span>User Name</span>
      <strong>{{ userName }}</strong>
    </div>
    <div class="profile-row">
      <span>Email</span>
      <strong>{{ userEmail }}</strong>
    </div>
    <div class="profile-row">
      <span>Role</span>
      <strong>{{ roleId }}</strong>
    </div>
  </article>

  <article class="profile-card">
    <h2>Company Context</h2>
    <div class="profile-row">
      <span>Company</span>
      <strong>{{ companyName }}</strong>
    </div>
    <div class="profile-row">
      <span>Company ID</span>
      <strong class="mono">{{ companyId }}</strong>
    </div>
    <div class="profile-row">
      <span>Environment</span>
      <strong class="env-pill">{{ environmentLabel }}</strong>
    </div>
  </article>
</section>
