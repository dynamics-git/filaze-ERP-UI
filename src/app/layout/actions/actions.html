<section class="filaz-commandbar">
  <div class="command-work">
    <div class="work-title">{{ pageContext.title }}</div>
    <div class="work-meta">
      <span>{{ pageContext.module }}</span>
      <span>{{ pageContext.company }}</span>
      <span>{{ activeViewLabel }}</span>
    </div>
  </div>

  <div class="command-main">
    <button type="button" class="cmd-primary" (click)="newClick.emit()">
      <i class="bi bi-plus-lg"></i>
      New
    </button>

    <button type="button" class="cmd" (click)="deleteClick.emit()">Delete</button>
    <button type="button" class="cmd" (click)="refreshClick.emit()">Refresh</button>

    <span class="cmd-divider"></span>

    @for (command of visibleCommands; track command.id) {
      <button
        type="button"
        class="cmd"
        [disabled]="command.disabled"
        (click)="runCommand(command)">
        {{ command.label }}
        @if (command.type === 'menu') {
          <i class="bi bi-chevron-down"></i>
        }
      </button>
    }
  </div>

  <div class="command-tools">
    <div class="view-switch">
      <button type="button" [class.active]="activeView === 'All'" (click)="setView('All')">All</button>
      <button type="button" [class.active]="activeView === 'Open'" (click)="setView('Open')">Open</button>
      <button type="button" [class.active]="activeView === 'Posted'" (click)="setView('Posted')">Posted</button>
      <button type="button" [class.active]="activeView === 'Exception'" (click)="setView('Exception')">Exception</button>
    </div>

    @if (showFilterTool) {
      <button type="button" class="tool" (click)="filterClick.emit()">
        <i class="bi bi-funnel"></i>
        Filter
      </button>
    }

    @if (showExportTool) {
      <button type="button" class="tool" (click)="exportClick.emit()">
        <i class="bi bi-download"></i>
        Export
      </button>
    }

    @if (showColumnsTool) {
      <button type="button" class="tool">
        <i class="bi bi-layout-three-columns"></i>
        Columns
      </button>
    }
  </div>
</section>
